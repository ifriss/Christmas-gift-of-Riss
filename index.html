<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas gift of Riss</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050a1a;--fg:#cfe3ff;--dim:#7389b0;--gold:#ffd36b;color-scheme:dark;box-sizing:border-box}
html,body{height:100%;height:100dvh;margin:0;background:var(--bg);overflow:hidden}
body{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;color:var(--fg)}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;z-index:1;-webkit-user-select:none;user-select:none}

#hint{position:fixed;left:max(14px,env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 10px);font-size:11px;color:var(--dim);pointer-events:none;z-index:10}
#tt{position:fixed;right:max(14px,env(safe-area-inset-right,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 10px);font-size:11px;color:#ff8a8a;pointer-events:none;z-index:10}

#name{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 32px);text-align:center;font-size:clamp(14px,4.5vw,18px);font-weight:700;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 10px #ffcf4a99,0 0 22px #ffcf4a44;cursor:pointer;animation:nm 3.2s ease-in-out infinite;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis;padding:4px 10px;border-radius:8px;transition:background .2s;z-index:20}
#name:hover{background:#101b3a88}
@keyframes nm{50%{text-shadow:0 0 14px #ffcf4acc,0 0 30px #ffcf4a66}}
@media (prefers-reduced-motion:reduce){#name{animation:none}}

#hud{position:fixed;left:max(14px,env(safe-area-inset-left,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 125px);font-size:11px;line-height:1.5;color:var(--dim);pointer-events:none;z-index:10}
#hud b{color:var(--fg);font-weight:400}

#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:5px;justify-content:center;flex-wrap:wrap;padding:0 8px;z-index:10}
button{font:inherit;font-size:11px;color:var(--fg);background:#101b3a;border:1px solid #2a3b70;border-radius:999px;padding:6px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button[aria-pressed="true"]{background:#1d2f63;border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

@media (max-width: 480px){
  #hint,#tt{font-size:10px;top:calc(env(safe-area-inset-top,0px) + 8px)}
  #name{top:calc(env(safe-area-inset-top,0px) + 26px)}
  #hud{font-size:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 112px)}
  button{font-size:10px;padding:5px 9px}
}

#modal{position:fixed;inset:0;background:rgba(3,6,26,0.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:99999;padding:16px}
.modal-box{background:#0d1633;border:1px solid #2a3b70;border-radius:16px;padding:24px 20px;width:100%;max-width:360px;text-align:center;box-shadow:0 10px 30px rgba
