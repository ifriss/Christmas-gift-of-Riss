<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Christmas gift of Riss - Đang bảo trì</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050a1a;
      --fg: #cfe3ff;
      --dim: #7389b0;
      --gold: #ffd36b;
      color-scheme: dark;
      box-sizing: border-box;
    }
    *, *::before, *::after { box-sizing: inherit; }

    html, body {
      height: 100%;
      height: 100dvh;
      margin: 0;
      background: var(--bg);
      overflow: hidden;
    }
    body {
      font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, "PingFang SC", "Microsoft YaHei", monospace;
      color: var(--fg);
    }

    #c {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    main {
      position: fixed;
      left: 0;
      right: 0;
      top: calc(env(safe-area-inset-top, 0px) + max(64px, 11vh));
      z-index: 10;
      padding: 0 22px;
      text-align: center;
      pointer-events: none;
    }

    #name {
      display: inline-block;
      font-size: clamp(13px, 4vw, 17px);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--gold);
      text-shadow: 0 0 10px #ffcf4a99, 0 0 22px #ffcf4a44;
      animation: nm 3.2s ease-in-out infinite;
    }
    @keyframes nm {
      50% { text-shadow: 0 0 14px #ffcf4acc, 0 0 30px #ffcf4a66; }
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(26px, 7.5vw, 44px);
      font-weight: 700;
      line-height: 1.2;
      color: var(--fg);
      text-shadow: 0 0 18px #52f0ff55;
    }
    .cur {
      color: #52f0ff;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    #msg {
      max-width: 36ch;
      margin: 0 auto;
      font-size: 13px;
      line-height: 1.75;
      color: var(--dim);
    }
    #eta {
      margin: 12px 0 0;
      font-size: 12px;
      font-weight: 700;
      color: #4ef57b;
    }
    #eta:empty { display: none; }

    @media (prefers-reduced-motion: reduce) {
      #name, .cur { animation: none; }
    }

    #top-tools {
      position: fixed;
      right: max(14px, env(safe-area-inset-right, 0px) + 10px);
      top: calc(env(safe-area-inset-top, 0px) + 10px);
      z-index: 30;
      display: flex;
      gap: 6px;
    }
    button {
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      background: #101b3ae6;
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.2s;
    }
    button:hover { background: #1d2f63; }
    button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #lang-btn { border: 1px solid #4ef57b; color: #4ef57b; }
    #refresh-btn { border: 1px solid #ff9a3c; color: #ff9a3c; }

    #dev-credit {
      position: fixed;
      right: max(14px, env(safe-area-inset-right, 0px) + 12px);
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      z-index: 15;
      max-width: 340px;
      font-size: 12.5px;
      line-height: 1.5;
      text-align: right;
      pointer-events: none;
      text-shadow: 0 2px 6px rgba(3, 6, 26, 0.95);
    }
    #dev-credit .dc-role { color: #52f0ff; font-weight: 700; }
    #dev-credit .dc-name {
      color: #ffd36b;
      font-weight: 700;
      text-shadow: 0 0 10px #ffd36b55, 0 2px 6px rgba(3, 6, 26, 0.95);
    }
    #dev-credit .dc-wish { color: #4ef57b; font-weight: 600; }

    @media (max-width: 640px) {
      #dev-credit { font-size: 10px; max-width: 215px; }
      #msg { font-size: 12.5px; }
      button { font-size: 10px; padding: 5px 8px; }
    }
  </style>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>

  <main>
    <div id="name">Christmas gift of Riss</div>
    <h1><span id="h-text">Đang bảo trì</span><span class="cur" aria-hidden="true">_</span></h1>
    <p id="msg"></p>
    <p id="eta"></p>
  </main>

  <div id="top-tools">
    <button id="lang-btn" type="button" title="Switch language / Đổi ngôn ngữ / 切换语言">🌐 VI</button>
    <button id="refresh-btn" type="button" title="Làm mới / Reload / 刷新">🔄</button>
  </div>

  <div id="dev-credit">
    <span class="dc-role">DEV:</span> <span class="dc-name">RISS - Trương Thành Thông</span><br>
    <span class="dc-wish" id="wish"></span>
  </div>

  <script>
    (function () {
      // Điền giờ dự kiến mở lại nếu muốn, ví dụ: '24/12 20:00 (GMT+7)'. Để trống thì ẩn dòng này.
      const REOPEN = '';

      const T = {
        vi: {
          badge: '🌐 VI',
          h: 'Đang bảo trì',
          msg: 'Cây thông đang được thay đèn. Mình sẽ mở lại sớm, bạn quay lại sau nhé.',
          eta: 'Dự kiến mở lại: ',
          wish: 'chúc mọi người giáng sinh vui vẻ 🎄'
        },
        en: {
          badge: '🌐 EN',
          h: 'Under maintenance',
          msg: 'The tree is getting new lights. We will be back soon, please check again later.',
          eta: 'Expected back: ',
          wish: 'wishes everyone a Merry Christmas 🎄'
        },
        zh: {
          badge: '🌐 中文',
          h: '维护中',
          msg: '圣诞树正在更换彩灯，很快就会回来，请稍后再来看看。',
          eta: '预计恢复：',
          wish: '祝大家圣诞快乐 🎄'
        }
      };
      const ORDER = ['vi', 'en', 'zh'];
      let lang = 'vi';
      try {
        const s = localStorage.getItem('cgor_lang');
        if (ORDER.indexOf(s) !== -1) lang = s;
      } catch (e) {}

      const langBtn = document.getElementById('lang-btn');

      function apply() {
        const d = T[lang];
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
        document.title = 'Christmas gift of Riss - ' + d.h;
        langBtn.textContent = d.badge;
        document.getElementById('h-text').textContent = d.h;
        document.getElementById('msg').textContent = d.msg;
        document.getElementById('eta').textContent = REOPEN ? d.eta + REOPEN : '';
        document.getElementById('wish').textContent = d.wish;
      }

      langBtn.addEventListener('click', function () {
        lang = ORDER[(ORDER.indexOf(lang) + 1) % ORDER.length];
        try { localStorage.setItem('cgor_lang', lang); } catch (e) {}
        apply();
      });
      document.getElementById('refresh-btn').addEventListener('click', function () {
        location.reload();
      });
      apply();

      // ---------- Cây thông ASCII với đèn đang tắt, tuyết rơi, sao nhấp nháy ----------
      const cv = document.getElementById('c');
      const ctx = cv.getContext('2d');
      const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const hs = function (a, b) {
        let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      };
      const LIGHTS = ['#ff3b3b', '#ffcf4a', '#4aa3ff', '#ff7ad9', '#52f0ff', '#ff9a3c'];
      const FILL = '@#%&xo*+';

      let W, H, dpr, cw, ch, cols, rows, sky, stars = [], snow = [], t = 0;

      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth;
        H = innerHeight;
        cv.width = W * dpr;
        cv.height = H * dpr;
        cw = Math.max(5, Math.min(10, W / 76));
        ch = cw * 1.55;
        cols = Math.ceil(W / cw);
        rows = Math.ceil(H / ch);

        sky = ctx.createLinearGradient(0, 0, 0, H);
        sky.addColorStop(0, '#03061a');
        sky.addColorStop(0.7, '#0a1636');
        sky.addColorStop(1, '#0d1c42');

        stars = [];
        for (let i = 0; i < 110; i++) {
          stars.push({ c: (Math.random() * cols) | 0, r: (Math.random() * rows * 0.8) | 0, p: Math.random() * 6.28, s: 0.6 + Math.random() * 2.2 });
        }
        snow = [];
        if (!rm) {
          for (let i = 0; i < 140; i++) {
            snow.push({ x: Math.random() * cols, y: Math.random() * rows, v: 2 + Math.random() * 5, p: Math.random() * 6.28, z: Math.random() });
          }
        }
        if (rm) draw(0);
      }

      function put(c, r, chr, color, a) {
        if (c < 0 || r < 0 || c >= cols || r >= rows) return;
        ctx.globalAlpha = a;
        ctx.fillStyle = color;
        ctx.fillText(chr, (c + 0.5) * cw, (r + 0.5) * ch);
      }

      function draw(dt) {
        t += dt;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);
        ctx.font = '700 ' + (cw / 0.6).toFixed(1) + 'px "JetBrains Mono",ui-monospace,Menlo,monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        for (const s of stars) {
          const v = rm ? 0 : Math.sin(t * s.s + s.p);
          put(s.c, s.r, v > 0.5 ? '+' : v > -0.3 ? '.' : '*', v > 0.2 ? '#eaf4ff' : '#46557c', 0.7);
        }

        const groundRow = Math.floor((H * 0.86) / ch);
        for (let r = groundRow; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const h = hs(c, r * 3);
            if (h < 0.55) put(c, r, h < 0.3 ? '-' : '.', h < 0.1 ? '#eaf4ff' : '#46557c', 0.8);
          }
        }

        const c0 = (cols / 2) | 0;
        const treeRows = Math.max(8, Math.min(30, Math.floor(Math.min(H * 0.33, W * 0.9) / ch)));
        const maxHW = Math.max(3, Math.floor((0.3 * treeRows * ch) / cw));
        const treeBottom = groundRow - 3;
        const rTop = treeBottom - treeRows + 1;

        for (let k = 0; k < treeRows; k++) {
          const f = (k + 1) / treeRows;
          const hw = Math.round(maxHW * f * (1 - 0.14 * ((f * 5) % 1)));
          const r = rTop + k;
          for (let dc = -hw; dc <= hw; dc++) {
            const c = c0 + dc;
            const h = hs(c, r);
            if (hw > 0 && dc === -hw) { put(c, r, '/', '#0d7a33', 0.9); continue; }
            if (hw > 0 && dc === hw) { put(c, r, '\\', '#0d7a33', 0.9); continue; }
            const lh = hs(c + 7, r + 3);
            if (lh < 0.07) {
              const v = rm ? 0 : Math.sin(t * (0.8 + h * 1.5) + h * 40);
              const on = v > 0.9;
              put(c, r, on ? 'O' : 'o', LIGHTS[((lh * 1000) | 0) % LIGHTS.length], on ? 1 : 0.22);
            } else {
              put(c, r, FILL[(h * FILL.length) | 0], h < 0.35 ? '#0d7a33' : h < 0.75 ? '#17b848' : '#35e866', 0.5);
            }
          }
        }

        put(c0, rTop - 1, '*', '#ffd36b', rm ? 0.5 : 0.35 + 0.35 * (0.5 + 0.5 * Math.sin(t * 2)));
        for (let r = groundRow - 2; r < groundRow; r++) {
          for (let dc = -1; dc <= 1; dc++) put(c0 + dc, r, '#', '#8b5a2b', 0.85);
        }

        for (const f of snow) {
          f.y += f.v * dt;
          if (f.y > rows) { f.y -= rows; f.x = Math.random() * cols; }
          const c = (((f.x + Math.sin(t * 0.9 + f.p) * 2) | 0) % cols + cols) % cols;
          put(c, f.y | 0, f.z > 0.66 ? '*' : f.z > 0.33 ? '+' : '.', f.z > 0.5 ? '#eaf4ff' : '#8aa0c8', 0.55 + 0.4 * f.z);
        }
        ctx.globalAlpha = 1;
      }

      function frame(now) {
        const dt = Math.min(0.05, (now - (frame.l || now)) / 1000);
        frame.l = now;
        draw(dt);
        requestAnimationFrame(frame);
      }

      addEventListener('resize', resize);
      resize();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () { if (rm) draw(0); });
      }
      if (!rm) requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
