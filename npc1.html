<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>DEV Gate — NPC1</title>
  <style>
    :root {
      --bg: #050a1a;
      --card: #0d1633;
      --input: #070e24;
      --border: #2a3b70;
      --fg: #cfe3ff;
      --dim: #8aa0c8;
      --gold: #ffd36b;
      --cyan: #52f0ff;
      --green: #4ef57b;
      --red: #ff5c7c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px 14px 60px;
      background: var(--bg);
      color: var(--fg);
      font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, sans-serif;
      font-size: 13px;
    }
    .wrap { max-width: 1120px; margin: 0 auto; }

    #login-gate {
      max-width: 400px;
      margin: 60px auto;
      background: var(--card);
      border: 1px solid var(--gold);
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.75);
    }
    #login-gate h2 { margin: 0 0 6px; font-size: 16px; color: var(--gold); text-align: center; }
    #login-gate p { margin: 0 0 16px; font-size: 11.5px; color: var(--dim); text-align: center; line-height: 1.45; }
    .login-err {
      display: none;
      background: rgba(255, 59, 92, 0.14);
      border: 1px solid var(--red);
      color: #ff8fa8;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11.5px;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .login-err.show { display: block; }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: 16px; color: var(--gold); }
    .sub { color: var(--dim); font-size: 12px; margin-top: 4px; }
    .dev-pill {
      display: inline-block;
      background: rgba(255, 211, 107, 0.18);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 10.5px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 5px;
    }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }
    button, .file-label {
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 8px 13px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: #101b3a;
      color: var(--fg);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover, .file-label:hover { background: #1a2b5c; }
    button:disabled { opacity: 0.55; cursor: wait; }
    .btn-gold { border-color: var(--gold); color: var(--gold); background: #1d2f63; }
    .btn-green { border-color: var(--green); color: var(--green); }
    .btn-cyan { border-color: var(--cyan); color: var(--cyan); }
    .btn-red { border-color: var(--red); color: #ff8fa8; }
    .btn-sm { padding: 4px 8px; font-size: 11px; }
    input[type="file"] { display: none; }

    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .tab { padding: 9px 16px; border-radius: 10px; color: var(--dim); }
    .tab.active { background: #1d2f63; border-color: var(--gold); color: var(--gold); }

    .status {
      display: none;
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 14px;
      font-size: 12px;
      background: rgba(78, 245, 123, 0.12);
      border: 1px solid var(--green);
      color: var(--green);
    }
    .status.err {
      background: rgba(255, 59, 92, 0.12);
      border-color: var(--red);
      color: #ff8fa8;
    }
    .status.show { display: block; }

    .hint-bar {
      background: rgba(82, 240, 255, 0.08);
      border: 1px solid rgba(82, 240, 255, 0.35);
      color: #b8e4ff;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 11.5px;
      margin-bottom: 12px;
      line-height: 1.45;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .row-head {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      color: var(--gold);
      font-weight: 700;
      font-size: 12px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 820px) { .grid-3 { grid-template-columns: 1fr; } }

    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px; }
    .field label { font-size: 11px; color: var(--dim); font-weight: 700; }
    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 10px;
      color: var(--fg);
      font: inherit;
      font-size: 12.5px;
      line-height: 1.45;
      resize: vertical;
      outline: none;
    }
    textarea:focus, input:focus { border-color: var(--gold); }
    .qa-pair {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #09112b;
      padding: 9px;
      border-radius: 9px;
      border: 1px solid #1d2c59;
    }
  </style>
</head>
<body>

  <!-- CHỈ HIỂN THỊ CỔNG ĐĂNG NHẬP; KHÔNG CHỨA BẤT KỲ MÃ GIAO DIỆN QUẢN TRỊ NÀO -->
  <div id="login-gate">
    <h2>🛠️ KHU VỰC QUẢN TRỊ DEV</h2>
    <p id="gate-msg">Chỉ tài khoản có huy hiệu <b>DEV</b> mới được cấp quyền truy cập.</p>
    <div class="login-err" id="login-err"></div>
    <form id="login-form">
      <div class="field">
        <label for="dev-user">Tên tài khoản DEV</label>
        <input type="text" id="dev-user" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="dev-pass">Mật khẩu</label>
        <input type="password" id="dev-pass" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-gold" id="btn-login" style="width:100%;margin-top:6px;padding:10px">Đăng nhập quản trị</button>
    </form>
  </div>

  <!-- VÙNG TRỐNG: CHỈ ĐƯỢC MÁY CHỦ BƠM HTML VÀO SAU KHI XÁC THỰC TOKEN DEV THÀNH CÔNG -->
  <div class="wrap" id="app-mount"></div>

<script>
  const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxrsc-RtFFOPjfbTAjcTsxFcmlUMXPCkRslxr_ZotyQ0XaXHj0TecatX7oRseX22Zs24A/exec";
  const AUTH_KEY = "cgor_auth_user";

  let devUser = null;
  let quotes = [];
  let qaList = [];
  let loadedHtmlRaw = "";
  let loadedFileName = "index.html";

  function showLoginError(msg) {
    const el = document.getElementById("login-err");
    if (!msg) { el.classList.remove("show"); return; }
    el.textContent = msg;
    el.classList.add("show");
  }

  function notify(msg, isErr) {
    const el = document.getElementById("status");
    if (!el) return;
    el.textContent = msg;
    el.classList.toggle("err", !!isErr);
    el.classList.add("show");
    clearTimeout(notify._t);
    notify._t = setTimeout(() => el.classList.remove("show"), 4500);
  }

  function lockOut(reason) {
    devUser = null;
    quotes = [];
    qaList = [];
    try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
    document.getElementById("app-mount").innerHTML = "";
    document.getElementById("login-gate").style.display = "block";
    if (reason) showLoginError(reason);
  }

  // Gửi token lên Google Apps Script để xác thực thật sự và nhận HTML giao diện + dữ liệu
  async function fetchAdminSession(userObj, isSilentAuto) {
    if (!userObj || !userObj.token) return false;
    try {
      const res = await fetch(SHEET_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "verify_dev_admin", token: userObj.token })
      });
      const data = await res.json();
      if (!data || !data.ok || !data.adminHtml) {
        if (!isSilentAuto) {
          lockOut("⛔ Tài khoản này không có quyền quản trị DEV (" + ((data && data.error) || "FORBIDDEN") + ").");
        } else {
          lockOut("");
        }
        return false;
      }

      devUser = {
        username: data.user.username,
        displayName: data.user.displayName,
        badge: data.user.badge,
        token: userObj.token
      };
      try { localStorage.setItem(AUTH_KEY, JSON.stringify(devUser)); } catch (e) {}

      quotes = Array.isArray(data.quotes) ? data.quotes : [];
      qaList = Array.isArray(data.qaList) ? data.qaList : [];

      document.getElementById("login-gate").style.display = "none";
      const mount = document.getElementById("app-mount");
      mount.innerHTML = data.adminHtml;
      bindAdminEvents();
      renderQuotes();
      renderQA();
      notify("✅ Đã xác thực DEV và tải " + quotes.length + " câu thoại, " + qaList.length + " hỏi đáp.");
      return true;
    } catch (err) {
      if (!isSilentAuto) showLoginError("❌ Không kết nối được tới máy chủ xác thực.");
      return false;
    }
  }

  // Kiểm tra phiên lưu sẵn (luôn xác thực lại với máy chủ, không tin tưởng localStorage)
  (async function init() {
    try {
      const saved = JSON.parse(localStorage.getItem(AUTH_KEY) || "null");
      if (saved && saved.token) {
        document.getElementById("gate-msg").textContent = "Đang xác thực quyền DEV với máy chủ...";
        const ok = await fetchAdminSession(saved, true);
        if (!ok) {
          document.getElementById("gate-msg").innerHTML = "Chỉ tài khoản có huy hiệu <b>DEV</b> mới được cấp quyền truy cập.";
        }
      }
    } catch (e) {}
  })();

  // Xử lý form đăng nhập
  document.getElementById("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    showLoginError("");
    const username = document.getElementById("dev-user").value.trim().toLowerCase();
    const password = document.getElementById("dev-pass").value;
    const btn = document.getElementById("btn-login");
    btn.disabled = true;

    try {
      const res = await fetch(SHEET_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify({ action: "login", username, password })
      });
      const data = await res.json();
      if (!data || !data.ok || !data.user) {
        showLoginError("❌ Sai tên tài khoản hoặc mật khẩu (" + ((data && data.error) || "LOGIN_FAILED") + ").");
      } else {
        document.getElementById("dev-pass").value = "";
        await fetchAdminSession(data.user, false);
      }
    } catch (err) {
      showLoginError("❌ Không kết nối được tới máy chủ Google Sheet.");
    }
    btn.disabled = false;
  });

  function bindAdminEvents() {
    const infoEl = document.getElementById("admin-info");
  infoEl.textContent = "Quản trị viên: ";
  const nameB = document.createElement("b");
  nameB.textContent = devUser.displayName;
  infoEl.appendChild(nameB);
  infoEl.appendChild(document.createTextNode(" (@" + devUser.username + ") "));
  const pill = document.createElement("span");
  pill.className = "dev-pill";
  pill.textContent = devUser.badge;
  infoEl.appendChild(pill);

    document.getElementById("btn-logout").onclick = () => lockOut("");
    document.getElementById("btn-reload-sheet").onclick = () => fetchAdminSession(devUser, false);

    document.getElementById("btn-save-sheet").onclick = async () => {
      if (!devUser || !devUser.token) return;
      const btn = document.getElementById("btn-save-sheet");
      btn.disabled = true;
      try {
        const res = await fetch(SHEET_API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({
            action: "save_santa_data",
            token: devUser.token,
            quotes: quotes,
            qaList: qaList
          })
        });
        const data = await res.json();
        if (data && data.ok) {
          notify("✅ Đã lưu lên Google Sheet (" + data.quotesCount + " câu thoại, " + data.qaCount + " hỏi đáp)!");
        } else if (data && (data.error === "UNAUTHORIZED" || data.error === "FORBIDDEN")) {
          lockOut("⛔ Phiên đăng nhập hết hạn hoặc không đủ quyền DEV.");
        } else {
          notify("❌ Lỗi lưu dữ liệu: " + ((data && data.error) || "ERROR"), true);
        }
      } catch (e) {
        notify("❌ Lỗi kết nối mạng khi lưu lên Google Sheet.", true);
      }
      btn.disabled = false;
    };

    document.getElementById("btn-add-quote").onclick = () => {
      quotes.push({ vi: "", en: "", zh: "" });
      renderQuotes();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    };

    document.getElementById("btn-add-qa").onclick = () => {
      qaList.push({ vi: { q: "", a: "" }, en: { q: "", a: "" }, zh: { q: "", a: "" } });
      renderQA();
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    };

    document.querySelectorAll(".tab").forEach(t => {
      t.onclick = () => {
        document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
        t.classList.add("active");
        const tab = t.getAttribute("data-tab");
        document.getElementById("pane-quotes").style.display = tab === "quotes" ? "block" : "none";
        document.getElementById("pane-qa").style.display = tab === "qa" ? "block" : "none";
      };
    });

    document.getElementById("file-in").onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      loadedFileName = f.name;
      loadedHtmlRaw = await f.text();
      const smPos = loadedHtmlRaw.indexOf("const SM =");
      if (smPos !== -1) {
        const parsed = { vi: [], en: [], zh: [] };
        ["vi", "en", "zh"].forEach(lang => {
          const bounds = findArrayBounds(loadedHtmlRaw, loadedHtmlRaw.indexOf("more:", loadedHtmlRaw.indexOf(lang + ":", smPos)));
          if (bounds) {
            try { parsed[lang] = Function('"use strict";return (' + loadedHtmlRaw.slice(bounds.open, bounds.close + 1) + ")")(); } catch (err) {}
          }
        });
        const maxLen = Math.max(parsed.vi.length, parsed.en.length, parsed.zh.length);
        if (maxLen > 0) {
          quotes = Array.from({ length: maxLen }, (_, i) => ({ vi: parsed.vi[i] || "", en: parsed.en[i] || "", zh: parsed.zh[i] || "" }));
          renderQuotes();
        }
      }
      document.getElementById("btn-export-html").style.display = "inline-flex";
      notify("📂 Đã nạp file " + loadedFileName);
    };

    document.getElementById("btn-export-html").onclick = () => {
      if (!loadedHtmlRaw) return;
      let out = loadedHtmlRaw;
      ["vi", "en", "zh"].forEach(lang => {
        const bounds = findArrayBounds(out, out.indexOf("more:", out.indexOf(lang + ":", out.indexOf("const SM ="))));
        if (bounds) {
          const arrStr = "[\n" + quotes.map(q => "            " + JSON.stringify(q[lang] || "")).join(",\n") + "\n          ]";
          out = out.slice(0, bounds.open) + arrStr + out.slice(bounds.close + 1);
        }
      });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([out], { type: "text/html;charset=utf-8" }));
      a.download = loadedFileName;
      a.click();
    };
  }

  function renderQuotes() {
    const cnt = document.getElementById("cnt-q");
    const box = document.getElementById("list-quotes");
    if (!cnt || !box) return;
    cnt.textContent = quotes.length;
    box.innerHTML = "";
    quotes.forEach((item, idx) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="row-head"><span>Câu #' + (idx + 1) + '</span>' +
        '<div style="display:flex;flex-wrap:wrap;gap:5px">' +
          '<button type="button" class="btn-sm btn-cyan" data-act="copy-vi">📋 Copy VI → EN/ZH</button>' +
          '<button type="button" class="btn-sm" data-act="up">▲</button>' +
          '<button type="button" class="btn-sm" data-act="down">▼</button>' +
          '<button type="button" class="btn-red btn-sm" data-act="del">🗑 Xóa</button>' +
        '</div></div>' +
        '<div class="grid-3">' +
          '<div class="field"><label>🇻🇳 Tiếng Việt (VI)</label><textarea rows="2" data-lang="vi"></textarea></div>' +
          '<div class="field"><label>🇺🇸 Tiếng Anh (EN)</label><textarea rows="2" data-lang="en"></textarea></div>' +
          '<div class="field"><label>🇨🇳 Tiếng Trung (ZH)</label><textarea rows="2" data-lang="zh"></textarea></div>' +
        '</div>';
      card.querySelectorAll("textarea").forEach(ta => {
        const l = ta.getAttribute("data-lang");
        ta.value = item[l] || "";
        ta.oninput = () => { quotes[idx][l] = ta.value; };
      });
      card.querySelector('[data-act="copy-vi"]').onclick = () => {
        const v = quotes[idx].vi || "";
        quotes[idx].en = v;
        quotes[idx].zh = v;
        renderQuotes();
      };
      card.querySelector('[data-act="up"]').onclick = () => {
        if (idx > 0) { [quotes[idx - 1], quotes[idx]] = [quotes[idx], quotes[idx - 1]]; renderQuotes(); }
      };
      card.querySelector('[data-act="down"]').onclick = () => {
        if (idx < quotes.length - 1) { [quotes[idx + 1], quotes[idx]] = [quotes[idx], quotes[idx + 1]]; renderQuotes(); }
      };
      card.querySelector('[data-act="del"]').onclick = () => { quotes.splice(idx, 1); renderQuotes(); };
      box.appendChild(card);
    });
  }

  function renderQA() {
    const cnt = document.getElementById("cnt-qa");
    const box = document.getElementById("list-qa");
    if (!cnt || !box) return;
    cnt.textContent = qaList.length;
    box.innerHTML = "";
    if (qaList.length === 0) {
      box.innerHTML = '<div class="card" style="color:var(--dim);text-align:center">Chưa có cặp Hỏi - Đáp bổ sung nào. Bấm <b>➕ Thêm cặp Hỏi - Đáp mới</b> ở trên để tạo.</div>';
      return;
    }
    qaList.forEach((item, idx) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="row-head"><span>Cặp Hỏi - Đáp bổ sung #' + (idx + 1) + '</span>' +
        '<div style="display:flex;gap:5px">' +
          '<button type="button" class="btn-sm btn-cyan" data-act="copy-vi">📋 Copy VI → EN/ZH</button>' +
          '<button type="button" class="btn-red btn-sm" data-act="del">🗑 Xóa</button>' +
        '</div></div>' +
        '<div class="grid-3">' +
          ["vi", "en", "zh"].map(l =>
            '<div class="qa-pair">' +
              '<div class="field"><label>' + l.toUpperCase() + ' — Câu hỏi</label><input type="text" data-l="' + l + '" data-k="q"></div>' +
              '<div class="field"><label>' + l.toUpperCase() + ' — Trả lời</label><textarea rows="3" data-l="' + l + '" data-k="a"></textarea></div>' +
            '</div>'
          ).join("") +
        '</div>';
      card.querySelectorAll("[data-l]").forEach(inp => {
        const l = inp.getAttribute("data-l"), k = inp.getAttribute("data-k");
        inp.value = (item[l] && item[l][k]) || "";
        inp.oninput = () => { qaList[idx][l][k] = inp.value; };
      });
      card.querySelector('[data-act="copy-vi"]').onclick = () => {
        qaList[idx].en = { q: qaList[idx].vi.q, a: qaList[idx].vi.a };
        qaList[idx].zh = { q: qaList[idx].vi.q, a: qaList[idx].vi.a };
        renderQA();
      };
      card.querySelector('[data-act="del"]').onclick = () => { qaList.splice(idx, 1); renderQA(); };
      box.appendChild(card);
    });
  }

  function findArrayBounds(src, startFrom) {
    const open = src.indexOf("[", startFrom);
    if (open === -1) return null;
    let depth = 0, quote = null;
    for (let i = open; i < src.length; i++) {
      const ch = src[i];
      if (quote) {
        if (ch === "\\") { i++; continue; }
        if (ch === quote) quote = null;
      } else {
        if (ch === "'" || ch === '"' || ch === "`") quote = ch;
        else if (ch === "[") depth++;
        else if (ch === "]") { depth--; if (depth === 0) return { open, close: i }; }
      }
    }
    return null;
  }
</script>
</body>
</html>
